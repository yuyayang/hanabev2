<section class="page-hero">
  <div class="container">
    <div class="index-label"><span>No.01</span><span class="index-label__rule"></span><span>Bloom Map · 花海地圖</span></div>
    <h1>跟著地圖去看花</h1>
    <p>依種類與花期篩選，點景點看花況、最佳時段，一鍵 Google Map 導航。</p>

<section class="form-wrap">

    <div class="filters">
      <div class="filters__row"><span class="label">種類</span><div class="tags" data-map="kind">
        <button type="button" class="tag" data-v="all" aria-pressed="true">全部</button>

        <button type="button" class="tag" data-v="now" aria-pressed="false">本週可賞</button>
        <button type="button" class="tag" data-v="soon" aria-pressed="false">即將登場</button>
      </div></div>
    </div>
    <div class="map-layout">
      <div class="map-box"><div id="bloom-map" role="region" aria-label="花海地圖"></div></div>
      <div class="map-list" id="map-list"></div>
    </div>
    <div class="map-legend label">
      <span><i style="background:#5D6E58"></i>花海 · 本週</span>
      <span><i style="background:#93705C"></i>季節景色 · 本週</span>
